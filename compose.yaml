services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eiren
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD in .env}
      POSTGRES_DB: eiren
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eiren_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eiren -d eiren"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eiren_pgdata:
